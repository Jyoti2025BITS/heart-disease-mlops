
services:

  heart-disease-api:

    build:

      context: .

      dockerfile: Dockerfile

    image: heart-disease-api:latest

    container_name: heart-disease-api-compose

    ports:

      - "8001:8000"

    restart: unless-stopped

    healthcheck:

      test:

        - CMD

        - python

        - -c

        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"

      interval: 30s

      timeout: 5s

      retries: 3

      start_period: 10s

